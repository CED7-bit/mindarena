<script>
"use strict";
/* ============ YARDIMCILAR ============ */
const $=s=>document.querySelector(s);
const app=$('#app');
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function seedRnd(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
 return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%1e4)/1e4;};}

/* ============ DURUM (offline, localStorage) ============ */
const KEY='mindarena_v1';
const DEF={name:'',color:'#a855f7',lang:'tr',calibrated:false,archetype:'',archIdx:null,goal:null,minutes:'10',
 skills:[25,25,25,25,25,25,25,25],daily:{date:'',points:0,tours:0},streak:0,lastTour:'',lives:2,toursDone:0,history:{},best:0,
 tasks:{date:'',defs:[],done:[],prog:{}},
 settings:{sound:true,haptic:true}};
function loadState(){try{const r=JSON.parse(localStorage.getItem(KEY));
 if(r&&r.skills)return Object.assign(JSON.parse(JSON.stringify(DEF)),r);}catch(e){}
 return JSON.parse(JSON.stringify(DEF));}
let S=loadState();
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function istDate(off=0){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul'}).format(new Date(Date.now()+off*864e5));}
function rollover(){const t=istDate();
 if(S.daily.date!==t){S.daily={date:t,points:0,tours:0};S.lives=Math.min(3,S.lives+1);save();}
 if(!S.tasks||S.tasks.date!==t)initTasks();}

/* ============ GÜNLÜK GÖREVLER ============ */
const TASK_POOL={
 tour1:{need:1,stat:'tours',rw:20,txt:()=>t('taskTour')},
 practice2:{need:2,stat:'practice',rw:15,txt:()=>t('taskPrac')},
 pts150:{need:150,stat:'points',rw:20,txt:()=>t('taskPts')}};
function taskDef(id){if(TASK_POOL[id])return TASK_POOL[id];
 if(/^w[0-7]$/.test(id)){const i=+id[1];
  return{need:1,stat:'w'+i,rw:15,txt:()=>t('taskWin')(gSub(GAMES[i]))};}
 return null;}
function initTasks(){const d=istDate(),rnd=seedRnd('MA'+d);
 const gi=Math.floor(rnd()*8),alt=rnd()<.5;
 S.tasks={date:d,defs:[{id:alt?'pts150':'tour1'},{id:'practice2'},{id:'w'+gi}],done:[false,false,false],prog:{}};
 save();}
function checkTasks(){S.tasks.defs.forEach((d,k)=>{if(S.tasks.done[k])return;
 const def=taskDef(d.id);if(!def)return;
 const cur=def.stat==='points'?S.daily.points:(S.tasks.prog[def.stat]||0);
 if(cur>=def.need){S.tasks.done[k]=true;
  const rw=Math.min(def.rw,Math.max(0,480-S.daily.points));
  S.daily.points+=rw;hap([20,50,20]);sfxGood();
  toast('🎯 '+t('taskDone')+(rw>0?' +'+rw:''));}});}
function taskEvent(stat,n){if(!S.tasks||S.tasks.date!==istDate())initTasks();
 S.tasks.prog[stat]=(S.tasks.prog[stat]||0)+n;checkTasks();save();}

let AC=null;
function beep(f,d,type='sine',v=.15,delay=0){if(!S.settings.sound)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
 o.connect(g);g.connect(AC.destination);const tm=AC.currentTime+delay;
 g.gain.setValueAtTime(v,tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);
 o.start(tm);o.stop(tm+d);}catch(e){}}
const sfxGood=()=>{beep(880,.09);beep(1318,.16,'sine',.12,.09);};
const sfxBad=()=>beep(165,.28,'sawtooth',.18);

function stopClock(){if(clock){clearInterval(clock);clock=null;}}
function startClock(sec,onEnd){stopClock();let ms=sec*1000;
 const tick=()=>{const el=$('#clock');if(!el)return;const left=Math.max(0,Math.ceil(ms/1000));
  el.textContent=left+t('sec');el.classList.toggle('hot',left<=5&&left>0);};
 tick();clock=setInterval(()=>{ms-=100;if(ms<=0){stopClock();tick();onEnd&&onEnd();}else tick();},100);}

/* ============ UYARLANIR ZORLUK (beceri puanına göre 0-4 seviye; kalibrasyon sabittir) ============ */
function lvlOf(i){return clamp(Math.floor((S.skills[i]-25)/15),0,4);}
function ADAPT(g){const L=lvlOf(g.i);
 switch(g.id){
  case'anagram':return{words:3+Math.floor(L/2),t:Math.max(18,30-L*3),lv:L};
  case'hesap':{const n=5+L;return{n,need:Math.ceil(n*.8),t:Math.max(5,8-Math.floor(L/2)),lv:L};}
  case'golge':{const n=4+L;return{n,need:Math.max(1,n-1),t:Math.max(8,12-Math.floor(L/2)),lv:L};}
  case'ritim':return{len:8+L*2,spd:560-L*40,lv:L};
  case'refleks':return{t:30,greens:15+L*2,need:10+Math.ceil(L*1.5),iv:620-L*40,lv:L};
  case'duygu':return{n:4+(L>=3?2:0),t:Math.max(8,15-L),lv:L};
  case'oncelik':{const n=3+Math.floor(L/2);return{n,need:Math.min(n,2+Math.floor(L/2)),lv:L};}
  case'sinif':return{t:30+L*3,cards:Math.min(30,20+L*4),need:10+Math.ceil(L*2.5),lv:L};
 }return{};}

let T=null,RUNID=0;
function killRun(){RUNID++;stopClock();}
function addSkill(i,perf){S.skills[i]=clamp(Math.round(S.skills[i]*.65+perf*.35),5,100);}
function startTour(mode){killRun();T={mode,idx:0,results:[],pts:0,recUsed:false};nextGame();}
function rankedActive(){return T&&T.mode==='ranked'&&S.daily.points<480;}
function nextGame(){if(T.idx>=8){finishTour();return;}runGame();}
function runGame(){rollover();const my=++RUNID;const g=GAMES[T.idx];const calib=T.mode==='calib';
 showBanner((calib?t('calibPre'):T.mode==='practice'?t('practPre'):t('roundPre')(T.idx+1))+gName(g),g.icon,()=>{
  if(my!==RUNID)return;
  const cfg=calib?CALIB[g.id]:ADAPT(g);
  GAMES_IMPL[g.id](cfg,res=>{ if(my!==RUNID)return; res=res||{success:false,perf:0};
   if(T.mode==='practice'){addSkill(T.idx,res.perf);taskEvent('practice',1);save();
    modal(`<h2 class="center">${res.success?t('practiceDone'):t('practiceBad')}</h2>
     <p class="gsub center" style="margin:8px 0">${t('prNoted')}</p>
     <button class="btn primary" onclick="closeModal();renderHome();">${t('home')}</button>`);return;}
   if(T.mode==='calib'){S.skills[T.idx]=Math.max(10,Math.round(res.perf));save();
    T.results.push({g,ok:res.success,pts:0});T.idx++;nextGame();return;}
   if(res.success){addSkill(T.idx,res.perf);let add=0;
    if(rankedActive()){add=Math.min(20,480-S.daily.points);S.daily.points+=add;T.pts+=add;}
    T.results.push({g,ok:true,pts:add});T.recUsed=false;
    taskEvent('w'+T.idx,1);taskEvent('wins',1);
    if(add>0){fly('+'+add);sfxGood();}else sfxTap();hap([20,40,20]);
    T.idx++;save();setTimeout(()=>{if(my===RUNID)nextGame();},650);}
   else if(!T.recUsed&&T.mode==='ranked'){T.recUsed=true;renderRecovery(res.msg);}
   else{applyPenalty();}
  });},calib?gSub(g):gSub(g)+' · '+t('lvl')+' '+(lvlOf(g.i)+1)+'/5');}
function applyPenalty(){killRun();const g=GAMES[T.idx];let sub=0;
 if(T.mode==='ranked'&&rankedActive()||T.mode==='ranked'&&S.daily.points>0){
  sub=Math.min(80,S.daily.points);S.daily.points-=sub;}
 T.results.push({g,ok:false,pts:-sub});T.recUsed=false;T.idx++;save();
 if(sub>0){fly('−'+sub);sfxBad();hap([60,40,60]);}
 nextGame();}
function finishTour(){killRun();
 if(T.mode==='calib'){S.calibrated=true;const ai=calcArchetype();S.archIdx=ai;
  S.archetype=ai<0?t('bal'):C().arch[ai];save();renderArchetype();return;}
 const today=istDate();
 if(S.lastTour!==today){S.streak=(S.lastTour===istDate(-1))?S.streak+1:1;S.lastTour=today;}
 S.daily.tours=Math.min(3,S.daily.tours+1);S.toursDone++;
 taskEvent('tours',1);
 if(T.results.length===8&&T.results.every(r=>r.ok))taskEvent('perfect',1);
 S.history[today]=S.daily.points;S.best=Math.max(S.best,S.daily.points);save();renderResults();}
function quitConfirm(){killRun();
 if(!T){renderHome();return;}
 if(T.mode==='calib'){modal(`<h2 class="center">${t('quitC')}</h2>
  <p class="gsub center" style="margin:8px 0">${t('quitCD')}</p>
  <button class="btn primary" onclick="closeModal();renderCalibIntro();">${t('backTest')}</button>
  <button class="btn ghost" onclick="closeModal();renderHome();">${t('exitYes')}</button>`);return;}
 if(T.mode==='practice'){closeModal();renderHome();return;}
 modal(`<h2 class="center">${t('quitT')}</h2>
  <p class="gsub center" style="margin:8px 0">${t('quitTD')}</p>
  <button class="btn primary" onclick="closeModal();">${t('stay')}</button>
  <button class="btn ghost" onclick="closeModal();applyPenalty();">${t('leave')}</button>`);}

GAMES_IMPL.hesap=function(cfg,finish){
 const n=(cfg&&cfg.n)||5,need=(cfg&&cfg.need)||4,tt=(cfg&&cfg.t)||8,lv=(cfg&&cfg.lv)||0;
 let qi=0,ok=0;
 app.innerHTML=shell(GAMES[1],t('hesRule')(n,need),'');
 $('#quitBtn').addEventListener('click',quitConfirm);
 function gen(){const k=qi%5;let q;
  if(k===0){const a=rint(12,58+25*lv),b=rint(12,48+22*lv);q={t:a+' + '+b+' = ?',c:a+b};}
  else if(k===1){const a=rint(40,90+25*lv),b=rint(10,39+20*lv);q={t:a+' − '+b+' = ?',c:a-b};}
  else if(k===2){const a=rint(6,12+3*lv),b=rint(3,9+2*lv);q={t:a+' × '+b+' = ?',c:a*b};}
  else if(k===3){const a=rint(4,9+2*lv),b=rint(3,8+2*lv),c=rint(2,20+10*lv);q={t:a+' × '+b+' − '+c+' = ?',c:a*b-c};}
  else{let s=rint(2,5+2*lv),seq=[s];for(let i=0;i<3;i++)seq.push(seq[i]*2+1);
   q={t:seq.join(', ')+' , ?',c:seq[3]*2+1};}
  const set=new Set([q.c]);
  while(set.size<4){const d=q.c+pick([-1,1])*rint(1,Math.max(2,Math.round(Math.abs(q.c)*.2)+2));
   if(d!==q.c)set.add(d);}
  q.o=shuffle([...set]);return q;}
 function load(){const q=gen();

   <div class="opts">${q.o.map(o=>`<button class="opt mono" data-o="${o}">${o}</button>`).join('')}</div>`;
  startClock(tt,()=>resolve(null));
  $('#gbody').querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>resolve(b)));
  function resolve(btn){stopClock();
   const good=btn&&+btn.dataset.o===q.c;
   if(good){ok++;sfxGood();hap(15);next();}
   else{sfxBad();hap(90);
    if(btn)btn.classList.add('wrong');

    setTimeout(next,750);}}}
 function next(){qi++;if(qi>=n){const suc=ok>=need;
  finish({success:suc,perf:Math.round(ok/n*(suc?100:55))});}else load();}
 load();};

let ORB=null;
function stopOrb(){if(!ORB)return;cancelAnimationFrame(ORB.raf);
 window.removeEventListener('pointermove',ORB.mv);window.removeEventListener('touchmove',ORB.mv);ORB=null;}
function initOrb(){stopOrb();const cv=$('#orbCanvas');if(!cv)return;
 const ctx=cv.getContext('2d');const dpr=Math.min(3,window.devicePixelRatio||1);
 const W=cv.clientWidth||250,H=cv.clientHeight||250;
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 let px=W/2,py=H/2;
 const mv=e=>{if(!ORB)return;const r=cv.getBoundingClientRect();
  const x0=(e.touches?e.touches[0].clientX:e.clientX),y0=(e.touches?e.touches[0].clientY:e.clientY);
  if(x0==null||x0===undefined)return;
  px=clamp(x0-r.left,-W,W);py=clamp(y0-r.top,-H,H);};
 window.addEventListener('pointermove',mv);window.addEventListener('touchmove',mv,{passive:true});
 ORB={raf:0,mv};
 let reduced=false;try{reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
 function draw(now){ctx.clearRect(0,0,W,H);
  const cx=W/2+(px-W/2)*.10,cy=H/2+(py-H/2)*.10;
  const base=Math.min(W,H)/2-6;
  const R=base*.58*(1+Math.sin(now/900)*.02);
  const ang=Math.atan2(py-cy,px-cx);
  for(let i=0;i<30;i++){const a=i/30*Math.PI*2+now/6000;
   let d=Math.abs(Math.atan2(Math.sin(a-ang),Math.cos(a-ang)));
   const k=Math.max(0,1-d/1.4);
   const r1=R*1.16,r2=base*(.70+k*.26)+Math.sin(now/350+i*1.7)*5;
   ctx.strokeStyle=`rgba(167,139,250,${(.06+.30*k).toFixed(3)})`;
   ctx.lineWidth=1.5+k*2.5;ctx.beginPath();
   ctx.moveTo(cx+r1*Math.cos(a),cy+r1*Math.sin(a));
   ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a));ctx.stroke();}
  const g=ctx.createRadialGradient(cx,cy,R*.2,cx,cy,base*1.05);
  g.addColorStop(0,'rgba(139,92,246,.55)');g.addColorStop(1,'rgba(139,92,246,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,base*1.05,0,7);ctx.fill();
  const og=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);
  og.addColorStop(0,'#c4b5fd');og.addColorStop(.55,'#7c3aed');og.addColorStop(1,'#1e1b4b');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
  const fr=[[.80,clamp(S.daily.tours/3,0,1),'#fbbf24'],[.90,clamp(S.daily.points/480,0,1),'#22d3ee'],[1.0,clamp(S.streak/7,0,1),'#34d399']];
  fr.forEach(([rr,f,col])=>{ctx.beginPath();ctx.arc(cx,cy,base*rr,0,7);
   ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=4.5;ctx.stroke();
   ctx.beginPath();ctx.arc(cx,cy,base*rr,-Math.PI/2,-Math.PI/2+2*Math.PI*f);
   ctx.strokeStyle=col;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';});
  ctx.fillStyle='#fff';ctx.font='700 20px Sora, system-ui';ctx.textAlign='center';
  ctx.fillText(S.daily.points,cx,cy+1);
  ctx.fillStyle='#c7d2fe';ctx.font='11px Manrope, system-ui';
  ctx.fillText(t('ptsUnit'),cx,cy+18);
  ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(px,py,2,px,py,36);
  hg.addColorStop(0,'rgba(196,181,253,.55)');hg.addColorStop(1,'rgba(196,181,253,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.arc(px,py,36,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';}
 if(reduced){draw(0);}
 else{const loop=n=>{if(!ORB)return;draw(n);ORB.raf=requestAnimationFrame(loop);};
  ORB.raf=requestAnimationFrame(loop);}}

/* ============ EKRANLAR ============ */
function renderSplash(){stopOrb();app.innerHTML=`<div class="center" style="margin:auto">
 <div class="pulse" style="width:150px;height:150px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 40% 32%,#c4b5fd,#7c3aed 55%,#1e1b4b);box-shadow:0 0 70px rgba(139,92,246,.6)"></div>
 <h1>MindArena</h1><p class="gsub">${t('tagline')}</p></div>`;
 setTimeout(()=>{S.calibrated?renderHome():renderOnboard();},1500);}

function renderOnboard(){stopOrb();const slides=[
 ['🧠',t('onb1t'),t('onb1d')],['⚡',t('onb2t'),t('onb2d')],
 ['📊',t('onb3t'),t('onb3d')],['🎮',t('onb4t'),t('onb4d')]];
 let i=0;
 function draw(){const s=slides[i];
  app.innerHTML=`<button class="iconbtn" id="langT" style="position:fixed;top:14px;right:14px;z-index:5">${S.lang==='tr'?'EN':'TR'}</button>
   <div class="center" style="margin:auto"><div class="hero">${s[0]}</div>
   <h2>${s[1]}</h2><p class="gsub" style="font-size:15px;line-height:1.5;margin:10px 0">${s[2]}</p>
   <div class="dots">${slides.map((_,k)=>`<span class="dot ${k===i?'on':''}"></span>`).join('')}</div></div>
   <button class="btn primary" id="nx">${i<slides.length-1?t('next'):t('start')}</button>
   <button class="linkbtn" id="skip">${t('skip')}</button>`;
  $('#langT').addEventListener('click',()=>{S.lang=S.lang==='tr'?'en':'tr';save();renderOnboard();});
  $('#nx').addEventListener('click',()=>{sfxTap();i<slides.length-1?(i++,draw()):renderCalibIntro();});
  $('#skip').addEventListener('click',renderCalibIntro);}
 draw();}

function renderCalibIntro(){stopOrb();app.innerHTML=`<div class="center" style="margin:auto">

 <p class="gsub" style="font-size:15px;line-height:1.5;margin:12px 0">${t('hello')}${S.name?', <b>'+S.name+'</b>':''}! ${t('calibD')}</p>
 <p class="gsub" style="font-size:13px;line-height:1.5;margin:8px 0">${t('calibWarm')}</p></div>

 $('#st').addEventListener('click',()=>startTour('calib'));}

function renderArchetype(){stopOrb();const ai=S.archIdx!=null?S.archIdx:calcArchetype();
 const archName=ai<0?t('bal'):C().arch[ai];
 const top=S.skills.indexOf(Math.max(...S.skills));
 const foc=S.goal!=null?S.goal:S.skills.indexOf(Math.min(...S.skills));
 const plan={'5':S.lang==='en'?'One tour a day is enough.':'Günde 1 tur yeterli.',

  '15':S.lang==='en'?'Two tours + one practice make a big difference.':'2 tur + 1 antrenman büyük fark yaratır.'}[S.minutes||'10'];

 <div class="card">${radarSVG(S.skills)}</div>
 <div class="card" style="text-align:left">
  <div class="gsub">${t('topSkill')}</div>

 <div class="card center"><div class="gsub">${t('planT')}</div><b>${(S.minutes||'10')} ${t('minUnit')} · ${plan}</b></div>
 <p class="gsub">${t('archNote')}</p></div>

function lifeModal(i){modal(`<h2 class="center">${GAMES[i].icon} ${gName(GAMES[i])}</h2>

  T={mode:'practice',idx:i,results:[],pts:0,recUsed:false};runGame();});

function renderProfileCreate(){stopOrb();const colors=['#a855f7','#22d3ee','#fbbf24','#34d399','#f87171'];

  <p class="gsub center" style="margin:8px 0">${t('profD')}</p>
  <div class="card"><input class="txt" id="nm" maxlength="16" placeholder="${t('nickPh')}" value="${S.name||''}">
   <div class="row" style="justify-content:center;margin-top:14px" id="sw">
    ${colors.map(c=>`<div class="swatch ${c===S.color?'on':''}" data-c="${c}" style="background:${c}"></div>`).join('')}</div></div>
  <div class="card"><div class="gsub">${t('goalQ')}</div>

    ${GAMES.map((g,i)=>`<button class="chip gsel ${goal===i?'on':''}" data-i="${i}">${g.icon} ${gName(g)}</button>`).join('')}</div>
   <div class="gsub" style="margin-top:12px">${t('minQ')}</div>
   <div class="row" id="minWrap" style="gap:8px;margin-top:6px">

  <button class="btn primary big" id="done">${t('done')}</button>`;
 $('#sw').querySelectorAll('.swatch').forEach(s=>s.addEventListener('click',()=>{
  $('#sw').querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x===s));sfxTap();}));
 $('#goalWrap').querySelectorAll('.gsel').forEach(b=>b.addEventListener('click',()=>{
  goal=+b.dataset.i;$('#goalWrap').querySelectorAll('.gsel').forEach(x=>x.classList.toggle('on',x===b));sfxTap();}));
 $('#minWrap').querySelectorAll('.gsel').forEach(b=>b.addEventListener('click',()=>{
  mins=b.dataset.m;$('#minWrap').querySelectorAll('.gsel').forEach(x=>x.classList.toggle('on',x===b));sfxTap();}));
 $('#done').addEventListener('click',()=>{S.name=($('#nm').value||'—').trim();S.color=app.querySelector('.swatch.on').dataset.c;
  S.goal=goal;S.minutes=mins;save();renderHome();});}

function renderHome(){rollover();
 const capped=S.daily.points>=480;
 app.innerHTML=`
 <div class="topbar">
  <div class="row"><div class="avatar" style="background:${S.color}">${(S.name[0]||'M').toUpperCase()}</div>

 <div class="spherewrap"><div class="orbbox"><canvas id="orbCanvas"></canvas></div></div>

 <button class="btn primary big" id="playBtn">${capped?t('trainStart'):t('tourStart')}</button>

 <div class="row" style="justify-content:space-between">

 initOrb();
 $('#orbCanvas').addEventListener('click',()=>{hap(15);beep(432,.25,'sine',.1);

 $('#profBtn').addEventListener('click',renderProfile);

 app.querySelectorAll('.gcard').forEach(c=>c.addEventListener('click',()=>{

   <button class="btn ghost" id="pno">${t('pCancel')}</button>`);
  $('#pok').addEventListener('click',()=>{closeModal();killRun();
   T={mode:'practice',idx:i,results:[],pts:0,recUsed:false};runGame();});

function renderRecovery(msg){stopOrb();const g=GAMES[T.idx];
 app.innerHTML=`<div class="center" style="margin:auto">
  <div class="hero">💔</div><h2>${t('recT')}</h2>

  <p class="gsub">${t('recD')}</p></div>
 <button class="btn gold big" id="adBtn">${t('adBtn')}</button>
 <button class="btn primary" id="lifeBtn" ${S.lives>0?'':'disabled'}>${t('lifeBtn')} (${S.lives})</button>
 <button class="btn ghost" id="giveBtn">${t('giveBtn')}</button>
 <p class="gsub center">${t('adNote')}</p>`;
 $('#adBtn').addEventListener('click',()=>{const d=document.createElement('div');d.className='adov';
  d.innerHTML=`<div><div class="hero">🎬</div><h2>${t('adT')}</h2><p class="gsub">${t('adDemo')}</p>
   <div class="mono" id="adn" style="font-size:40px;color:#fbbf24;margin-top:12px">3</div></div>`;
  document.body.appendChild(d);let n=3;
  const iv=setInterval(()=>{n--;const e=document.getElementById('adn');if(e)e.textContent=n;
   if(n<=0){clearInterval(iv);d.remove();runGame();}},1000);});
 $('#lifeBtn').addEventListener('click',()=>{if(S.lives>0){S.lives--;save();runGame();}});
 $('#giveBtn').addEventListener('click',applyPenalty);}
